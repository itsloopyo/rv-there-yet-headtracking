[workspace]
name = "rv-there-yet-head-tracking"
version = "0.3.0"
description = "Head tracking mod for RV There Yet (UE5, Steam/Xbox WinGDK) using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
cmake = ">=3.28"
# Packaging runs core's config descriptor check (Copy-SharedBundle) with node,
# and `test` and render-config run core's canonical config scripts with it.
# Pinned to the release core's own lock resolves.
nodejs = "==26.5.0"

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# Configure CMake (x64, MSVC, UE5/WinGDK target)
# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# The lean-boundary behaviour lock, the config tests, the config differential
# test, which holds the frozen HeadTracking.ini reader to v0.3.0's and the
# migration into CameraUnlock.ini to the frozen reader, and core's canonical
# config lint over every file that test migrated. Needs no game install.
test = { cmd = "ctest --test-dir build -C Release --output-on-failure", depends-on = ["build"] }

# Rewrites HeadTracking.ini, the committed CameraUnlock.ini (the path core's
# data/config-format.json records), from the config table after a change to a
# row, a comment or a default, then writes the launcher manifest's config
# descriptor per_game from it. rvty_config_tests fails until it has run.
render-config = { cmd = "build/Release/rvty_config_tests.exe --render-config HeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build"] }

install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
uninstall = "powershell -ExecutionPolicy Bypass -File scripts/uninstall.ps1"

# Depends on test, so no ZIP is built from a tree whose behaviour lock or config
# differential test fails.
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }

# Shim-only mod: no mod loader is vendored (the dxgi.dll proxy IS the shim).
# Kept as a no-op so the launcher/dev workflow can call it uniformly.
update-deps = { cmd = """
    powershell -Command "Write-Host 'No vendored dependencies to update (shim-only mod).'"
""" }

clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

# Full release workflow - creates tag and pushes to trigger CI release
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

# Checks the newest release/*-installer.zip against the launcher manifest rules
# and the canonical config's delivery rules. Run after package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

# Run a Ghidra headless script from scripts/ghidra/ against the game EXE.
ghidra-script = "powershell -ExecutionPolicy Bypass -File scripts/ghidra-headless.ps1"

# Compare the installed RV There Yet EXE's PE fingerprint against every build
# profile in src/RVThereYetHeadTracking/builds/. Run after a game patch to find
# out whether RVAs need rederiving before cutting a new release.
check-fingerprint = "powershell -ExecutionPolicy Bypass -File scripts/check-fingerprint.ps1"
