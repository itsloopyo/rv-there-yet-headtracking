; RV There Yet Head Tracking - configuration

[Network]
Port = 4242

[Tracking]
EnableOnStartup = true
YawSensitivity = 1.0
PitchSensitivity = 1.0
RollSensitivity = 1.0
InvertYaw = false
InvertPitch = false
InvertRoll = false
; 0.0 - 1.0. Higher = steadier but laggier view. Smoothing is picked per
; connection from the tracker's source address and covers rotation and position.
; LocalSmoothing applies when the tracker runs on this machine (loopback).
LocalSmoothing = 0.0
; RemoteSmoothing applies when the tracker is a remote device on the network
; (eg a phone app over WiFi, where a little smoothing pays for itself).
RemoteSmoothing = 0.15
; true = the interaction reticle/prompt follows your aim point while your head
; is turned. false = leave it at screen centre (vanilla).
ShowReticle = true
; Yaw mode: true = horizon-locked yaw (default), false = camera-local
WorldSpaceYaw = true

[Reticle]
; Fine-tune reticle follow strength (1.0 = geometric aim point). Raise/lower if
; the reticle over/undershoots the thing you're pointing at.
Scale = 1.0
; Comma-separated UMG widget names moved to the aim point (the look-at reticle
; and object label). Leave blank to use the built-in defaults
; (Crosshair, LookAtObjectName).
WidgetNames =

[Position]
; 6DOF lean tracking - move your head to lean around the cabin. Toggle in-game
; with Page Up (cycles rotation+position / rotation only / position only).
Enabled = true
SensitivityX = 1.0
SensitivityY = 1.0
SensitivityZ = 1.0
; Flip a lean direction that feels reversed. The mod already orients every
; axis for this game, so all three are off by default.
InvertX = false
InvertY = false
InvertZ = false
; Travel limits in meters (how far the view can lean).
LimitX = 0.30
LimitY = 0.20
; Forward gets the generous allowance; leaning back is restricted so the view
; does not clip through the seat and player.
LimitZ = 0.40
LimitZBack = 0.10
; Position uses the [Tracking] LocalSmoothing / RemoteSmoothing values.

[Hotkeys]
; Toggle tracking (End) and cycle tracking mode (Page Up) are fixed, each also
; reachable with a Ctrl+Shift chord (Y / G). Only the yaw-mode toggle is
; rebindable here. VK code: PageDown = 0x22.
ToggleYawMode = 0x22
